name: OpenCFS clean-room CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build independent C11 core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DOPEN_CFS_BUILD_HOST_TESTS=ON
          cmake --build build --parallel 2
      - name: Test fail-closed simulation and RS485 RX decoding
        run: ctest --test-dir build --output-on-failure
      - name: Enforce nonflashable board-manifest contract
        run: python3 tests/test_board_manifest.py

  arm-object-compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM Cortex-M4 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Cross compile portable core only (NO ELF, BIN OR DEVICE IO)
        run: |
          arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -std=c11 -Os \
            -ffreestanding -fno-builtin -Wall -Wextra -Werror -Wpedantic \
            -Iinclude -c src/safety_gate.c -o /tmp/opencfs-safety-gate.o
          arm-none-eabi-size /tmp/opencfs-safety-gate.o
          arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -std=c11 -Os \
            -ffreestanding -fno-builtin -Wall -Wextra -Werror -Wpedantic \
            -Iinclude -c src/rs485_rx.c -o /tmp/opencfs-rs485-rx.o
          arm-none-eabi-size /tmp/opencfs-rs485-rx.o
          # The portable core must have no unresolved libc dependencies.
          test -z "$(arm-none-eabi-nm -u /tmp/opencfs-rs485-rx.o)"
          test ! -f firmware.bin
          test ! -f firmware.elf

  sanitized-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C11 AddressSanitizer and UndefinedBehaviorSanitizer build
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug -DOPEN_CFS_BUILD_HOST_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-sanitized --parallel 2
      - name: Run bounded protocol decoder and safety model under sanitizers
        run: ctest --test-dir build-sanitized --output-on-failure

  cpp-spec-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C++17 spec core, simulator and tests (sanitized)
        run: |
          cmake -S cpp -B build-cpp -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-cpp --parallel 2
      - name: Run host simulation tests (includes deterministic fuzzing)
        run: ctest --test-dir build-cpp --output-on-failure
      - name: Conformance with the real Kalico host code (box_protocol, serial_485, box_cfs_runtime)
        run: |
          git clone --depth 1 --branch k2-pro-openhost https://github.com/MzTechnology97/kalico-k2pro /tmp/kalico
          python3 cpp/tests/kalico_conformance.py --bridge build-cpp/cfs_host_bridge --extras /tmp/kalico/klippy/extras
      - name: Static analysis (cppcheck, non-blocking until tuned)
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --std=c++17 --enable=warning,performance,portability --inline-suppr --error-exitcode=1 -Icpp/include -Icpp/board/k2cfs cpp/lib cpp/board/k2cfs
      - name: Install ARM Cortex-M4 C++ compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib libnewlib-arm-none-eabi
      - name: Cross compile the C++ core and board-port objects (objects only, NO ELF OR BIN)
        run: |
          for f in cpp/lib/*.cpp cpp/lib/tags/*.cpp cpp/board/k2cfs/*.cpp; do
            arm-none-eabi-g++ -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
              -std=c++17 -Os -fno-exceptions -fno-rtti -ffreestanding \
              -Wall -Wextra -Werror -Wpedantic -Icpp/include -Icpp/board/k2cfs \
              -c "$f" -o "/tmp/$(basename "$f" .cpp).o"
          done
          arm-none-eabi-size /tmp/*.o
          test ! -f firmware.bin
          test ! -f firmware.elf
      - name: Link the EXPERIMENTAL RELEASE, INERT and BENCH images and check them (no artifact is uploaded)
        run: python3 cpp/tools/build_image.py --variant all --seal --out build-arm
      - name: Boot each linked image in an emulator (Unicorn, minimal GD32F303 model)
        run: |
          python3 -m venv /tmp/emu && /tmp/emu/bin/pip install --quiet unicorn
          for v in release inert bench busrel busled; do
            /tmp/emu/bin/python cpp/tests/image_boot_test.py build-arm/$v/opencfs-unsealed.bin
          done
